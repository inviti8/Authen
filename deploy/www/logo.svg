<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Authen">
  <title>Authen</title>
  <!-- Periodic-table cell. "Au" is the element symbol for gold and the first two
       letters of Authen; 79 is gold's real atomic number. The two letterforms
       carry the two chains the signing key belongs to: the A is built from
       straight mitred strokes (angular, Algorand), the u from a single swept arc
       with round caps (orbital, Stellar). -->
  <rect x="5" y="5" width="190" height="190" rx="18"
        fill="none" stroke="#9a5b2e" stroke-width="6"/>

  <!-- atomic number -->
  <text x="24" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="24" font-weight="600" fill="#9a5b2e">79</text>

  <!-- A — mitred, angular -->
  <g fill="none" stroke="#1c1a17" stroke-width="13"
     stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
    <path d="M 30 134 L 56 66 L 82 134"/>
    <path d="M 40 110 L 72 110"/>
  </g>

  <!-- u — swept, orbital -->
  <g fill="none" stroke="#1c1a17" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 102 88 L 102 111 A 22 22 0 0 0 146 111"/>
    <path d="M 146 88 L 146 134"/>
  </g>

  <!-- name -->
  <text x="100" y="172" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="1.5" fill="#1c1a17">Authen</text>
</svg>
