# PintheonV2 — public vhost for the flagship node.
#
# Written from scratch rather than adapted from V1's setup_pintheon.sh. V1's public
# vhost does `try_files $uri $uri.html $uri/ =404` on `location /` with no @app
# fallback, which makes its `location @app` block dead code and any new Flask route
# unreachable (BUILD_PLAN.md §4 bug #3). Do not copy that pattern here.
#
# Public HTTPS is a competition gate item: no localhost, no self-signed.
#
#   ln -s /etc/nginx/sites-available/pintheonv2.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream pintheonv2 {
    server 127.0.0.1:8402 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name pintheon.example.art;

    # certbot writes challenges here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is enabled on the listen line, not with the standalone `http2 on;`
    # directive. That directive is nginx >= 1.25.1; Ubuntu 24.04 ships 1.24, where
    # it is an UNKNOWN DIRECTIVE and nginx refuses to load the config at all —
    # which takes the whole site down, not just HTTP/2. The listen-line form works
    # from 1.9.5 onward. On >= 1.25.1 it is deprecated but functional, and
    # scripts/vps_startup.sh rewrites it to the modern form there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pintheon.example.art;

    ssl_certificate     /etc/letsencrypt/live/pintheon.example.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pintheon.example.art/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/pintheonv2.access.log;
    error_log  /var/log/nginx/pintheonv2.error.log;

    # An issue is ~24 full-resolution pages zipped. Do not buffer it to disk on the
    # way out, and do not let a slow reader trip the settle path.
    client_max_body_size 4m;
    proxy_buffering off;

    # Must exceed the route's max_timeout_seconds (120 in config/node.toml), because
    # the per-buyer render window lives inside the request once Phase 2 lands.
    proxy_connect_timeout 15s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    location / {
        proxy_pass http://pintheonv2;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # x402 headers.
        #
        # nginx forwards inbound request headers to the upstream by default, and
        # passes upstream response headers back, so PAYMENT-SIGNATURE in and
        # PAYMENT-RESPONSE out both work without help. Two caveats worth knowing:
        #
        #   1. nginx DROPS request headers containing underscores unless
        #      `underscores_in_headers on`. The x402 v2 names are hyphenated
        #      (PAYMENT-SIGNATURE / PAYMENT-REQUIRED / PAYMENT-RESPONSE) so they are
        #      unaffected — but do not "helpfully" rename them.
        #   2. Access-Control-Expose-Headers is set by the app (web/app.py). Without
        #      it a browser client cannot read the settlement receipt even though it
        #      arrives on the wire.
        #
        # This is the nginx-side counterpart of the tunnel's header-whitelist bug
        # (BUILD_PLAN.md §4 bug #2). Verify with a live call, never by reading config.
        proxy_pass_request_headers on;
    }

    # Cheap liveness target for the uptime monitor. Must stay up through the
    # 2026-10-08 shortlist window.
    location = /health {
        proxy_pass http://pintheonv2;
        access_log off;
    }
}
