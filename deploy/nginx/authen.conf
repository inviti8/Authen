# Authen — public vhost for the flagship node.
#
# Written from scratch rather than adapted from V1's setup_authen.sh. V1's public
# vhost does `try_files $uri $uri.html $uri/ =404` on `location /` with no @app
# fallback, which makes its `location @app` block dead code and any new Flask route
# unreachable (BUILD_PLAN.md §4 bug #3). Do not copy that pattern here.
#
# Public HTTPS is a competition gate item: no localhost, no self-signed.
#
# This file is DEPLOYABLE VERBATIM for the flagship node — it carries the real
# hostname, not a placeholder, so updating the live vhost is a copy with no edit
# step:
#
#   sudo cp /opt/authen/deploy/nginx/authen.conf /etc/nginx/sites-available/authen.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# There is nothing private here to keep out of a public repo. The hostname is in
# DNS, in every 402 challenge, and in the Bazaar listing; the upstream is loopback.
# It previously used an `authen.example.com` placeholder that scripts/vps_startup.sh
# rewrote with sed, which meant every manual deploy needed a four-line hand-edit and
# a half-edited file briefly sat at the live path — where certbot's renewal timer
# could have reloaded it against a cert path that did not exist.
#
# Retargeting to another host is still supported: vps_startup.sh substitutes this
# hostname for $DOMAIN. Change it in ONE place (that script's config block), never
# by editing the copy under /etc/nginx.
#
# First install only:
#   ln -s /etc/nginx/sites-available/authen.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream authen {
    server 127.0.0.1:8402 fail_timeout=0;
}

# Concurrency caps for /api/v1/c2pa/verify. That route is free, unauthenticated,
# accepts 48 MiB, and reads the whole body into the heap
# (`request.get_data(cache=False)`), so concurrent requests are the only thing
# standing between it and the box's memory. gunicorn runs 2 workers x 4 threads,
# so 8 concurrent 48 MiB bodies is ~384 MiB with nothing paying for it.
#
# These are http-context directives. That is why they sit out here beside
# `upstream` rather than inside the server block — sites-enabled files are
# included from inside `http`, so this file's top level IS http context. Putting
# them in the server block is an "unknown directive" and nginx refuses to load
# ANY config, which takes the whole site down.
#
# The real fix is spooling the body to disk instead of the heap
# (AUTHEN_API_REPORT.md §4). These caps are what makes the limit increase safe to
# ship before that lands, not a substitute for it.
limit_conn_zone $binary_remote_addr zone=verify_per_ip:10m;
limit_conn_zone $server_name        zone=verify_total:1m;

server {
    listen 80;
    listen [::]:80;
    server_name authen.hvym.link;

    # certbot writes challenges here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is enabled on the listen line, not with the standalone `http2 on;`
    # directive. That directive is nginx >= 1.25.1; Ubuntu 24.04 ships 1.24, where
    # it is an UNKNOWN DIRECTIVE and nginx refuses to load the config at all —
    # which takes the whole site down, not just HTTP/2. The listen-line form works
    # from 1.9.5 onward. On >= 1.25.1 it is deprecated but functional, and
    # scripts/vps_startup.sh rewrites it to the modern form there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name authen.hvym.link;

    ssl_certificate     /etc/letsencrypt/live/authen.hvym.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/authen.hvym.link/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/authen.access.log;
    error_log  /var/log/nginx/authen.error.log;

    # Do not advertise the nginx version in error pages.
    server_tokens off;

    # Default body cap for the whole vhost. Deliberately small: the free routes
    # (/api/v1/verify, /api/v1/c2pa/verify, /api/v1/identity) have no paywall in
    # front of them, so every byte allowed here is an unpriced allocation any
    # caller can trigger. The paid routes raise it individually below, which also
    # means a route added later inherits the SMALL cap until someone opts it in.
    client_max_body_size 4m;
    proxy_buffering off;

    # THE 402 CHALLENGE IS A RESPONSE HEADER, AND IT OUTGREW THE DEFAULT BUFFER.
    #
    # x402 v2 puts the whole PaymentRequired document — accepts, description, and
    # both extension declarations with their JSON Schemas — into the base64
    # PAYMENT-REQUIRED header. Measured 2026-08-14: 4,396 bytes of response headers
    # on /api/v1/notarize, against nginx's 4k default. nginx answers "upstream sent
    # too big header" with a 502 and never forwards the response.
    #
    # The failure is vicious to diagnose. gunicorn logs `402 2 1ms` — a clean, fast,
    # correct challenge — while every caller sees 502. The app looks healthy, the
    # free routes are unaffected because their headers are small, and nothing in the
    # application logs hints at nginx. It broke the paid routes for ~15 minutes after
    # a commit that only added prose to a schema description.
    #
    # `proxy_buffering off` above does NOT cover this: that directive governs the
    # response BODY. proxy_buffer_size bounds the header and applies either way.
    #
    # 16k is ~4x current worst case. The challenge grows every time a route
    # description or an extension schema does, so leave headroom and keep
    # tests/test_challenge_size.py honest about the number.
    proxy_buffer_size   16k;
    proxy_buffers     8 16k;
    proxy_busy_buffers_size 32k;

    # Must exceed the route's max_timeout_seconds (120 in config/node.toml), because
    # the per-buyer render window lives inside the request once Phase 2 lands.
    proxy_connect_timeout 15s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Proxy settings live at server level so every location inherits one copy.
    # nginx inherits proxy_set_header from the enclosing level only when the inner
    # level declares none of its own — so the locations below must not add any.
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # x402 headers.
    #
    # nginx forwards inbound request headers to the upstream by default, and
    # passes upstream response headers back, so PAYMENT-SIGNATURE in and
    # PAYMENT-RESPONSE out both work without help. Two caveats worth knowing:
    #
    #   1. nginx DROPS request headers containing underscores unless
    #      `underscores_in_headers on`. The x402 v2 names are hyphenated
    #      (PAYMENT-SIGNATURE / PAYMENT-REQUIRED / PAYMENT-RESPONSE) so they are
    #      unaffected — but do not "helpfully" rename them.
    #   2. Access-Control-Expose-Headers is set by the app (web/app.py). Without
    #      it a browser client cannot read the settlement receipt even though it
    #      arrives on the wire.
    #
    # This is the nginx-side counterpart of the tunnel's header-whitelist bug
    # (BUILD_PLAN.md §4 bug #2). Verify with a live call, never by reading config.
    proxy_pass_request_headers on;

    # CORS exposure, set HERE rather than in the app, and `always` is load-bearing.
    #
    # The 402 challenge is generated by payment_middleware in the WSGI layer, which
    # sits outside Flask - so Flask's `after_request` never runs for it and the app
    # cannot put a header on the one response a browser payer most needs to read.
    # Measured: free 200s carried Access-Control-Expose-Headers, the 402 carried
    # nothing at all. GoPlausible's x402 Doctor flags this.
    #
    # `always` sends the header on non-2xx too; without it nginx omits it from the
    # 402 and the fix silently does nothing. proxy_hide_header first, so the value
    # the app sets on its own responses does not arrive alongside this one and
    # leave two copies on the wire.
    #
    # Keep in step with _EXPOSE_HEADERS in authen/web/app.py.
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Expose-Headers
        "PAYMENT-REQUIRED, PAYMENT-RESPONSE, X-PAYMENT-RESPONSE, X-Authen-Attestation, X-Authen-CA-Fingerprint"
        always;

    # An oversized request must be refused BEFORE the x402 middleware runs, so the
    # caller is never charged for a request that cannot succeed. That ordering is
    # what these caps buy, and it only holds while nginx is the stricter layer:
    #
    #   client_max_body_size  <=  MAX_BODY_BYTES in authen/web/app.py
    #
    # Flask's MAX_CONTENT_LENGTH is enforced INSIDE the WSGI app that
    # payment_middleware wraps (authen/x402/server.py). Let nginx go higher than it
    # and the size check moves behind the paywall: verify, settle, then 413 — the
    # buyer pays and gets nothing. If you raise one number, raise the other first.
    location = /api/v1/notarize {
        client_max_body_size 32m;
        error_page 413 = @too_large_paid;
        proxy_pass http://authen;
    }

    location = /api/v1/c2pa/sign {
        client_max_body_size 32m;
        error_page 413 = @too_large_paid;
        proxy_pass http://authen;
    }

    # Free, and deliberately MORE permissive than the paid input cap.
    #
    # A C2PA-signed artifact is always LARGER than the bytes that produced it —
    # embedding the manifest is the thing being paid for. Measured on the live
    # node: a 13.2 MiB TIFF came back at 16.4 MiB, ~24% growth. So a route that
    # verifies signed output must exceed the 32 MiB paid input cap or the node
    # cannot read back its own most expensive product. At 4 MiB (the vhost
    # default this used to inherit) every image worth paying to sign produced an
    # output that 413'd here — the paid and free paths disagreed by 8x, in the
    # direction that breaks the product. See AUTHEN_API_REPORT.md §5.
    #
    # 48m covers 32 MiB in + growth. Raise MAX_BODY_BYTES in authen/web/app.py
    # FIRST if this ever goes higher; Flask is the stricter layer and would 413
    # regardless. tests/test_body_limits.py pins that ordering.
    location = /api/v1/c2pa/verify {
        client_max_body_size 48m;
        limit_conn verify_per_ip 2;
        limit_conn verify_total  4;
        error_page 413 = @too_large_verify;
        proxy_pass http://authen;
    }

    # Landing page. Served by nginx directly from the repo working tree, NOT by
    # the Flask app, and that is deliberate: a marketing copy edit must never
    # require `systemctl restart authen` on the box carrying the competition
    # uptime window. `git pull` updates the page; the API process is untouched.
    #
    # Exact match only. Everything else still proxies, so no API route can be
    # shadowed by a file appearing in deploy/www.
    #
    # Root `/` previously fell through to Flask and returned its 404, so anyone
    # who followed a link to this host saw an error page.
    location = / {
        root /opt/authen/deploy/www;
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Brand assets. These are load-bearing for discovery, not decoration: the
    # GoPlausible Bazaar builds a merchant's name/logo/description by scraping
    # this domain's site metadata, so og:image has to resolve for anyone, from
    # anywhere, without a referer. Verified against a merchant who has it —
    # algofile.io's og:image URL is byte-identical to its Bazaar `logo` field.
    location = /logo.svg    { root /opt/authen/deploy/www; try_files /logo.svg    =404; add_header Cache-Control "public, max-age=86400"; }
    location = /logo.png    { root /opt/authen/deploy/www; try_files /logo.png    =404; add_header Cache-Control "public, max-age=86400"; }
    location = /og-image.png { root /opt/authen/deploy/www; try_files /og-image.png =404; add_header Cache-Control "public, max-age=86400"; }

    location = /favicon.ico {
        root /opt/authen/deploy/www;
        try_files /logo.svg =404;
        types { } default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        proxy_pass http://authen;
    }

    # Cheap liveness target for the uptime monitor. Must stay up through the
    # 2026-10-08 shortlist window.
    location = /health {
        proxy_pass http://authen;
        access_log off;
    }

    # 413 in JSON, not nginx's stock HTML. This API has no human clients: an agent
    # that gets an unparseable body learns nothing and retries the same request.
    # Stating the actual limit is what lets it recover on its own.
    error_page 413 = @too_large;

    location @too_large {
        default_type application/json;
        return 413 '{"error":"body too large","max_bytes":4194304,"hint":"this route accepts up to 4 MiB; POST /api/v1/notarize and /api/v1/c2pa/sign accept 32 MiB, and POST /api/v1/c2pa/verify accepts 48 MiB"}';
    }

    location @too_large_verify {
        default_type application/json;
        return 413 '{"error":"body too large","max_bytes":50331648,"hint":"this route accepts up to 48 MiB, which is larger than the 32 MiB paid signing input so that any artifact this node signs can be read back here for free"}';
    }

    location @too_large_paid {
        default_type application/json;
        return 413 '{"error":"body too large","max_bytes":33554432,"hint":"this route accepts up to 32 MiB; the request was refused before payment and was not charged"}';
    }
}
