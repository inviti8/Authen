# Authen — node configuration (sample)
#
# Copy to config/node.toml and fill in. node.toml IS COMMITTED — everything in this
# file is public. Secrets live in environment variables; see .env.example.
#
# Loaded with tomllib (stdlib in 3.11+). No dependency.

[node]
name         = "Authen"
# Public HTTPS origin. A gate item for the competition — no localhost, no self-signed.
# This is also the origin the reader PWA installs from (service workers need a real
# origin; /ipfs/<cid>/ path-based gateway URLs scope badly).
public_url   = "https://authen.example.com"
# Active network profile: "mainnet" | "testnet". Prove the flow on testnet first.
network      = "testnet"


[treasury]
# The payTo address. PUBLIC — it is published in the Bazaar and is the leaderboard's
# aggregation unit.
#
# PERMANENT. Once registered with the competition this address cannot change:
# changing it splits your volume history into two entries, neither of which ranks.
# Never a placeholder. Committed here deliberately, so an accidental change shows up
# in a diff.
#
# The private key for this address NEVER touches the server. The x402 `exact` scheme
# only needs payTo as the asset receiver (`arcv`) — the buyer signs, the facilitator
# submits. Keep the mnemonic in a wallet, offline, backed up twice.
#
# MUST be opted into the USDC ASA before going live, or settlement fails at the
# facilitator's simulate step. Verify on-chain; do not assume.
mainnet = ""
testnet = ""


[identity]
# Node identity keypair — one seed derives Algorand + Stellar + X25519 (see
# IMPLEMENTATION_PLAN.md §4.2). This key is HOT: it lives on the node and signs
# macaroons / does ECDH for per-buyer sealing.
#
# Deliberately SEPARATE from [treasury]. Different jobs, different blast radius: a
# compromised node must not cost the competition revenue, and payTo cannot be rotated
# without splitting the leaderboard entry.
#
# THE SEED IS NOT CONFIGURED. The node generates it on first boot and persists it in
# the encrypted DB, the same way V1 self-generates master_key into pintheon.ini
# (pintheonMachine/__init__.py:91-96). V1 received its seed from Metavinci via a
# launch macaroon; V2 drops that dependency (BUILD_PLAN.md §5 decision 1). A fresh
# node needs no provisioning step.
#
# The addresses below are PUBLIC and recorded after first boot, so startup can assert
# the derivation still matches and catch a silently regenerated identity — the failure
# mode when a Docker state volume is not mounted.
# Recorded AFTER first boot: `curl https://<host>/api/v1/identity`. Startup asserts
# the live key still matches this, which catches the failure mode where a state
# volume did not mount and the node silently generated a new identity — every
# attestation it then signs is unverifiable against the key you published.
public_key = ""


[facilitator]
url = "https://facilitator.goplausible.xyz"
# The facilitator's own OpenAPI lives at /docs/openapi.json — NOT /openapi.json.


# ---------------------------------------------------------------------------
# Network profiles
#
# Note the identifier asymmetry, it is a real trap:
#   /data/*                    endpoints take `slug`   (algorand-mainnet)
#   /discovery/resources       takes `caip2`; the slug silently returns total: 0
# ---------------------------------------------------------------------------

[networks.mainnet]
caip2         = "algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8="
slug          = "algorand-mainnet"
usdc_asa      = "31566704"          # string, not int — x402 `asset` is an ASA id as string
usdc_decimals = 6
algod_url     = "https://mainnet-api.algonode.cloud"
# Expected facilitator fee payer, pinned for verification only. GoPlausible owns this
# address and may rotate it. At runtime prefer whatever /supported reports
# (payment_middleware(sync_facilitator_on_start=True) already fetches it); treat a
# mismatch with this value as a warning, not as truth.
fee_payer     = "ZMFK2OI7ZBD2U27ISERZC4S6LKM6WMFJPZQ4MYNJDZ2VNBNMBA67RA22AA"

[networks.testnet]
caip2         = "algorand:SGO1GKSzyE7IEPItTxCByw9x8FmnrCDexi9/cOUJOiI="
slug          = "algorand-testnet"
usdc_asa      = "10458941"
usdc_decimals = 6
algod_url     = "https://testnet-api.algonode.cloud"
fee_payer     = "ZMFK2OI7ZBD2U27ISERZC4S6LKM6WMFJPZQ4MYNJDZ2VNBNMBA67RA22AA"


[x402]
version             = 2
scheme              = "exact"
# Competition tag. Goes into PaymentOption.extra as `tag` — verified against the live
# Bazaar, 850 of 882 tagged resources put it at accepts[].extra.tag. Registration gate
# item: get the location wrong and the entry is untagged.
tag                 = "x402-global-challenge"
# Generous — the per-buyer render window lives inside this once Phase 2 lands.
max_timeout_seconds = 120


[pricing]
# One attestation, one axfer, one settlement.
#
# Micro-units (6 decimals) because that is the wire format — `amount` is a string of
# microunits. 50000 = $0.05. The three live provenance resources on this facilitator
# price at $0.01–$0.04 and none of them sign or publish a verifiable key, so this
# sits just above them deliberately.
notarize_micro_usdc = "50000"
# C2PA signing costs more: it issues a certificate, embeds and signs a manifest, and
# returns the whole re-encoded image. $0.15 is above everything on the rail today,
# which is deliberate - nothing else on it can do this.
c2pa_micro_usdc     = "150000"


[routes]
# Paid. The core flow — there is no unpaid path to an attestation, which is what
# judged criterion 2 measures.
notarize  = "/api/v1/notarize"
# Paid. Embeds C2PA Content Credentials into an image.
c2pa_sign = "/api/v1/c2pa/sign"
# Free. An attestation nobody can check is worth nothing, so checking costs nothing.
verify    = "/api/v1/verify"
# Free. The signing key, in every encoding it answers to.
identity  = "/api/v1/identity"
